<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — CV</title>
<style>
  /* ATS-safe typography (#font-extraction fix):
     The bundled variable woff2 fonts (Space Grotesk / DM Sans) render with
     glyph advances that make PDF text extractors inject spurious spaces inside
     words (e.g. "SUM M ARY", "Germ any") — which corrupts ATS keyword parsing.
     This template's job is clean machine-readable parsing, so we use a standard
     static system sans stack instead. Verified clean via pypdf text extraction.
     The lang="ja" rules reuse this Latin base stack (with a CJK fallback added);
     the lang="ar" rules below intentionally define their own Arabic stack. */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    /* Disable fi/fl/ffi ligatures. Headless Chromium substitutes these letter
       pairs with the Unicode glyphs U+FB01/FB02/FB03 at PDF layout time, and PDF
       text extractors (what ATS systems read) decode them back to those
       codepoints, so "verification" becomes "veriﬁcation" and a literal keyword
       search misses it. Setting this on every element covers headings and
       competency tags too. Required ligatures (rlig) stay on, so Arabic shaping
       is unaffected. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    font-size: 11px;
    line-height: 1.5;
    color: #1a1a2e;
    background: #ffffff;
    padding: 0;
    margin: 0;
    /* Disable ligatures here as well; see the * rule above. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 2px 0;
  }

  /* === HEADER === */
  .header {
    margin-bottom: 8px;
    text-align: center;
  }

  .header h1 {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #000000;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    line-height: 1.1;
    text-align: center;
  }

  .header-gradient {
    display: none;
  }

  .contact-row {
    display: block;
    text-align: center;
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    font-size: 10px;
    line-height: 1.4;
    color: #4b5563;
  }

  .contact-row a {
    color: #000000;
    text-decoration: none;
  }

  .contact-row .separator {
    color: #000000;
  }

  /* === OPTIONAL PROFILE PHOTO (opt-in, DACH/European markets — #264) ===
     Off by default: with no candidate.photo the {{PHOTO}} slot is empty, no
     <img> is emitted, and the layout is byte-identical to a photoless CV.
     When opted in (candidate.photo in config/profile.yml) the photo floats into
     the top corner and the header/summary text wraps beside it. Photos are
     penalized by US/UK/many-market ATS, so this is never on by default. */
  .cv-photo {
    float: right;
    width: 80px;
    height: 100px;
    object-fit: cover;
    margin: 0 0 8px 14px;
    border-radius: 3px;
    border: 1px solid #e2e2e2;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 15px;
  }

  .section-title {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #000000;
    border-bottom: 1.5px solid #000000;
    padding-bottom: 2px;
    margin-bottom: 6px;
    line-height: 1.2;
  }

  /* === PROFESSIONAL SUMMARY === */
  .summary-section .section-title {
    display: none;
  }

  .summary-title {
    font-size: 11px;
    font-weight: 400;
    color: #000000;
    margin-bottom: 3px;
    line-height: 1.3;
  }

  .summary-body {
    font-size: 10.5px;
    line-height: 1.5;
    color: #000000;
    text-align: left;
    margin: 0;
  }

  /* Links must never break across lines */
  a {
    white-space: nowrap;
  }

  /* === CORE COMPETENCIES === */
  .competencies-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .competency-tag {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: #000000;
    background: #f1f5f9;
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid #cbd5e1;
  }

  /* === WORK EXPERIENCE === */
  .job {
    margin-bottom: 13px;
  }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 3px;
  }

  .job-company {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    color: #4b5563;
  }

  .job-period {
    font-size: 11px;
    font-weight: 400;
    color: #4b5563;
    white-space: nowrap;
  }

  .job-role {
    font-size: 11.5px;
    font-weight: 700;
    color: #000000;
  }

  .job-location {
    font-size: 11px;
    font-weight: 400;
    color: #4b5563;
  }

  .job-description {
    font-size: 10.5px;
    line-height: 1.5;
    color: #1a1a2e;
    margin-top: 4px;
    margin-bottom: 6px;
    font-style: italic;
  }

  .job ul {
    padding-left: 18px;
    margin-top: 4px;
  }

  .job li {
    font-size: 10.5px;
    line-height: 1.5;
    color: #1a1a2e;
    margin-bottom: 2.5px;
  }

  .job li strong {
    font-weight: 700;
  }

  /* === PROJECTS === */
  .project {
    margin-bottom: 12px;
  }

  .project-title {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    color: #000000;
  }

  .project-badge {
    font-size: 9px;
    font-weight: 500;
    color: #333333;
    background: #f1f5f9;
    padding: 1px 6px;
    border-radius: 2px;
    margin-left: 6px;
  }

  .project-desc {
    font-size: 10.5px;
    color: #444;
    margin-top: 3px;
    line-height: 1.55;
  }

  .project-tech {
    font-size: 9.5px;
    color: #888;
    margin-top: 3px;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 4px;
  }

  .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .edu-title {
    font-weight: 700;
    font-size: 11px;
    color: #000000;
  }

  .edu-org {
    color: #000000;
    font-weight: normal;
  }

  .edu-year {
    font-size: 11px;
    font-weight: 400;
    color: #4b5563;
    white-space: nowrap;
  }

  .edu-desc {
    font-size: 10px;
    color: #666;
    margin-top: 2px;
    line-height: 1.5;
  }

  /* === CERTIFICATIONS === */
  .cert-table {
    display: table;
    width: 100%;
  }

  .cert-item {
    display: table-row;
  }

  .cert-item > * {
    display: table-cell;
    vertical-align: baseline;
    padding-bottom: 6px;
  }

  .cert-title {
    font-size: 10.5px;
    font-weight: 500;
    color: #333;
  }

  .cert-org {
    color: #000000;
    white-space: nowrap;
  }

  .cert-year {
    font-size: 10px;
    color: #777;
    white-space: nowrap;
    text-align: right;
    width: 44px;
  }

  /* === SKILLS === */
  .skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }

  .skill-item {
    font-size: 10.5px;
    color: #000000;
    width: 100%;
    margin-bottom: 4px;
  }

  .skill-category {
    font-weight: 700;
    color: #000000;
    font-size: 10.5px;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      padding: 0 0.02in 0 0.02in;
      max-width: 100%;
      width: 100%;
    }
  }

  /* === PAGE BREAK CONTROL === */
  /* Only avoid breaking small atomic units (a cert row, an education line, the
     header, a single competency or skill).  Sections and multi-bullet roles are
     allowed to flow across a page boundary so content packs tight instead of
     jumping wholesale and leaving large bottom gaps. */
  .header,
  .edu-item,
  .cert-item,
  .competency-tag,
  .skill-item {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Keep a heading attached to the content that follows it, so headings are not
     orphaned at the bottom of a page. */
  .section-title,
  .job-company,
  .job-role,
  .project-title {
    break-after: avoid;
    page-break-after: avoid;
  }

  /* === RTL (Arabic) Support === */
  html[lang="ar"] body {
    direction: rtl;
    text-align: right;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  html[lang="ar"] .header h1,
  html[lang="ar"] .section-title,
  html[lang="ar"] .job-company,
  html[lang="ar"] .project-title,
  html[lang="ar"] .competency-tag,
  html[lang="ar"] .skill-category {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  html[lang="ar"] .header-gradient {
    display: none;
  }

  html[lang="ar"] .job ul {
    padding-right: 18px;
    padding-left: 0;
  }

  html[lang="ar"] .project-badge {
    margin-right: 6px;
    margin-left: 0;
  }

  html[lang="ar"] .cert-year {
    text-align: left;
  }

  html[lang="ar"] .cert-table {
    direction: rtl;
  }

  html[lang="ar"] .cv-photo {
    float: left;
    margin: 0 14px 8px 0;
  }

  /* === CJK (Japanese) font fallback === */
  /* The bundled webfonts are Latin-only (see #951). Without a CJK fallback,
     Japanese text renders as tofu (□) in headless Chromium on any system
     without a CJK system font (Linux/CI, minimal containers). The Latin brand
     fonts are kept first so ASCII still uses Space Grotesk / DM Sans, then the
     browser's per-glyph fallback picks the first installed CJK face for kana
     and kanji. Mirrors the lang="ar" precedent above. */
  html[lang="ja"] body {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
      'Yu Gothic', 'YuGothic', 'Noto Sans CJK JP', 'Noto Sans JP',
      Meiryo, 'MS PGothic', sans-serif;
  }

  html[lang="ja"] .header h1,
  html[lang="ja"] .section-title,
  html[lang="ja"] .job-company,
  html[lang="ja"] .project-title,
  html[lang="ja"] .competency-tag,
  html[lang="ja"] .skill-category {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
      'Yu Gothic', 'YuGothic', 'Noto Sans CJK JP', 'Noto Sans JP',
      Meiryo, 'MS PGothic', sans-serif;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    <div class="contact-row">
      {{CONTACT}}
    </div>
  </div>

  <!-- PROFESSIONAL SUMMARY -->
  <div class="section summary-section">
    <div class="section-title">{{SECTION_SUMMARY}}</div>
    <div class="summary-text">{{SUMMARY_TEXT}}</div>
  </div>

  {{COMPETENCIES}}

  <!-- WORK EXPERIENCE -->
  <div class="section">
    <div class="section-title">{{SECTION_EXPERIENCE}}</div>
    {{EXPERIENCE}}
  </div>

  {{PROJECTS}}

  <!-- EDUCATION -->
  <div class="section">
    <div class="section-title">{{SECTION_EDUCATION}}</div>
    {{EDUCATION}}
  </div>

  {{CERTIFICATIONS}}

  {{SKILLS}}

</div>
</body>
</html>
